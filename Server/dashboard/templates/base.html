<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Wordl Dashboard{% endblock %}</title>
<script>
(function () {
  var stored = localStorage.getItem('wordl-theme');
  if (stored) document.documentElement.setAttribute('data-theme', stored);
})();
</script>
<style>
:root {
  color-scheme: light;
  --page:       #f9f9f7;
  --surface:    #fcfcfb;
  --ink:        #0b0b0b;
  --secondary:  #52514e;
  --muted:      #898781;
  --gridline:   #e1e0d9;
  --baseline:   #c3c2b7;
  --blue:       #2a78d6;
  --good:       #0ca30c;
  --critical:   #d03b3b;

  --card:       #e7e6e1;   /* gray, rounded-corners card surface */
  --card-dark:  #3a3a37;   /* dark stripe / header-bar surface */
  --stripe:     #efeeea;   /* light row stripe inside a card */
  --border:     rgba(11, 11, 11, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:       #0d0d0d;
    --surface:    #1a1a19;
    --ink:        #ffffff;
    --secondary:  #c3c2b7;
    --muted:      #898781;
    --gridline:   #2c2c2a;
    --baseline:   #383835;
    --blue:       #3987e5;
    --good:       #0ca30c;
    --critical:   #d03b3b;

    --card:       #201f1d;
    --card-dark:  #55534d;
    --stripe:     #242422;
    --border:     rgba(255, 255, 255, 0.10);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:       #0d0d0d;
  --surface:    #1a1a19;
  --ink:        #ffffff;
  --secondary:  #c3c2b7;
  --muted:      #898781;
  --gridline:   #2c2c2a;
  --baseline:   #383835;
  --blue:       #3987e5;
  --good:       #0ca30c;
  --critical:   #d03b3b;

  --card:       #201f1d;
  --card-dark:  #55534d;
  --stripe:     #242422;
  --border:     rgba(255, 255, 255, 0.10);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; }
.topbar { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 24px 16px 0; }
.brand {
  background: var(--card-dark);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 18px;
  padding: 12px 28px;
  border-radius: 999px;
}
.theme-toggle {
  background: var(--card-dark);
  color: #fff;
  border: 0;
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  padding: 12px 20px;
  border-radius: 999px;
  cursor: pointer;
}
.page { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  overflow: hidden;
}
.card-title {
  margin: 0 0 12px;
  font-size: 15px;
  font-weight: 600;
  color: var(--secondary);
}

.list { list-style: none; margin: 0; padding: 0; border-radius: 12px; overflow: hidden; }
.list li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--surface);
}
.list li:nth-child(even) { background: var(--stripe); }
.list li a {
  flex: 1;
  text-decoration: none;
  font-weight: 500;
  color: var(--ink);
}
.list li a:hover { text-decoration: underline; }
.list .rank {
  width: 1.6em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.list .value {
  font-variant-numeric: tabular-nums;
  color: var(--secondary);
}

.segmented {
  display: inline-flex;
  background: var(--card-dark);
  border-radius: 999px;
  padding: 4px;
  margin-bottom: 12px;
}
.segmented button {
  border: 0;
  background: transparent;
  color: #fff;
  font: inherit;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 999px;
  cursor: pointer;
}
.segmented button.active { background: #fff; color: #0b0b0b; }

.hidden { display: none; }

.search-form { display: flex; gap: 8px; }
.search-form input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
}
.search-form button {
  border: 0;
  background: var(--card-dark);
  color: #fff;
  font: inherit;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: 999px;
  cursor: pointer;
}

.word-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  background: var(--surface);
}
.word-row:nth-child(even) { background: var(--stripe); }
.tiles { display: flex; gap: 3px; }
.tile {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--good);
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  border-radius: 4px;
  text-transform: uppercase;
}
.meter {
  flex: 1;
  height: 8px;
  background: var(--gridline);
  border-radius: 999px;
  overflow: hidden;
}
.meter > span { display: block; height: 100%; background: var(--good); }
.word-stat { width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; color: var(--secondary); }

.layout {
  display: grid;
  grid-template-columns: 2fr 1fr;
  grid-template-rows: auto 1fr;
  gap: 20px;
}
.leaderboard-card { grid-row: 1 / 3; }
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
  .leaderboard-card { grid-row: auto; }
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat-tile {
  background: var(--surface);
  border-radius: 12px;
  padding: 14px;
}
.stat-tile .value {
  font-size: 26px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.stat-tile .label,
.label {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.back-link { display: inline-block; margin-bottom: 16px; color: var(--secondary); text-decoration: none; }
.back-link:hover { text-decoration: underline; }

.profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.profile-header h1 { margin: 0; font-size: 26px; }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="/dashboard">copyright-safe wordle</a>
  <button id="theme-toggle" class="theme-toggle" type="button">Dark mode</button>
</div>
<main class="page">
{% block content %}{% endblock %}
</main>
<script>
(function () {
  function currentTheme() {
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr) return attr;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  var btn = document.getElementById('theme-toggle');
  function syncLabel() {
    btn.textContent = currentTheme() === 'dark' ? 'Light mode' : 'Dark mode';
  }
  function announce() {
    document.dispatchEvent(new CustomEvent('wordl-theme', { detail: { theme: currentTheme() } }));
  }
  btn.addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('wordl-theme', next);
    syncLabel();
    announce();
  });
  syncLabel();
  announce();
})();
</script>
</body>
</html>
